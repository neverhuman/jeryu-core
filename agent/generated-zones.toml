[[zones]]
path = ".jankurai/"
generator = "just score"
manual_edits = false

[[zones]]
path = "contracts/generated/"
generator = "cargo run -p jeryu-readmodel --bin export_contracts"
manual_edits = false

# Hand-authored normative contracts (lane A). Not generated: the drift test
# below fails when the schemas and the vault's Rust types disagree.
[[zones]]
path = "contracts/connection-v1/"
generator = "cargo test --locked -p jeryu-core --test connection_v1_contract"
manual_edits = true

# Jankurai's contract-source rule reads `[[zone]]` (the family `[[zones]]`
# table above stays for jeryu-mapcheck). Hand-authored: the schemas are their
# own source, and the drift test fails when they and the vault's Rust types
# disagree.
[[zone]]
path = "contracts/connection-v1/"
source = "contracts/connection-v1/"
command = "cargo test --locked -p jeryu-core --test connection_v1_contract"
write_policy = "hand_authored"

# agent/audit-policy.toml is hand-authored policy except its single
# required_tool_version scalar, which jeryu-tool/ops/render-tool-manifest.sh
# renders from protected tool-manifest.toml (crates/jeryu-tool-control/src/render_rules.rs).
# The whole policy is deliberately not declared a generated zone. pr-ci.sh
# additionally compares that scalar with the receipt-verified governed auditor.
