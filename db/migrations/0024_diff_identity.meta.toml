# jankurai:migration v1
id = "0024_diff_identity"
owner = "forge-api"
reviewer = "forge-api"
change_type = "expand"
safety = "online"
transaction = "required"
lock_timeout = "5s"
statement_timeout = "60s"
estimated_rows = 0
deploy_phase = "expand"
app_compatibility = "new_app_old_db"
